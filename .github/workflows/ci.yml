name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # -count=1 disables the test result cache. TestExpiryWarningMatchesFrontend
      # reads a file in apps/web, which lives outside this module, so the cache
      # does not track it — edit the frontend constant alone and a cached PASS is
      # replayed over a test that would now fail. A guard that can be cached into
      # silence is not a guard.
      - name: Test
        run: go test -short -count=1 ./...

      # Regenerates the OpenAPI spec and its site pages, then fails if that
      # changes anything already committed — the freshness check this generator
      # was deferred pending a spike on whether testcontainers actually works in
      # CI. It does: `go test -short` above already runs the full internal/handler
      # testcontainers suite (there is no -short gate on it — see the comment
      # there), so this reuses proven infrastructure rather than adding new. A
      # spec that silently drifts from the real API is worse than the MDX
      # tables it replaced: MDX was read by people, a spec is meant to be
      # consumed by codegen and client tooling directly.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/site/package-lock.json

      - name: Install site dependencies
        working-directory: apps/site
        run: npm ci

      - name: Regenerate the API reference
        # -run must keep including TestAPIDocAllMarshalerTypesHandled — it's
        # gated behind the same GENERATE_API_REFERENCE env var as the
        # generator itself (it re-walks the generator's own output), so
        # narrowing -run to just TestGenerateAPIReference silently stops it
        # from ever running, anywhere, defeating the guard it exists to be.
        # Found by peer review.
        run: go test -count=1 -timeout=120s -run 'TestGenerateAPIReference|TestAPIDocAllMarshalerTypesHandled' ./internal/handler/...
        env:
          GENERATE_API_REFERENCE: "1"

      - name: Regenerate the API reference's site pages
        working-directory: apps/site
        run: node scripts/generate-api-pages.mjs

      - name: Fail if the API reference is stale
        # Must run from the repo root: the job's default working-directory is
        # apps/api, and the pathspecs below are repo-relative. From apps/api
        # they resolve to apps/api/apps/site/..., which does not exist, so git
        # prints a warning to stderr, reports nothing on stdout and exits 0 —
        # the step passed whatever the tree looked like, and the spec went
        # stale unnoticed.
        working-directory: ${{ github.workspace }}
        # git diff only inspects TRACKED files, so it misses new files —
        # exactly what one-page-per-operation generates far more of, and a
        # renamed operationId (a dependency bump, an edit to the page
        # script) is a delete-plus-add where only the delete half shows.
        # git status --porcelain reports untracked files too; any output at
        # all means the working tree no longer matches what's committed.
        run: |
          status=$(git status --porcelain -- apps/site/public/openapi.json apps/site/content/docs/api)
          if [ -n "$status" ]; then
            echo "$status"
            echo "::error::apps/site/public/openapi.json or apps/site/content/docs/api is stale — run 'task generate:api-docs' and commit the result."
            exit 1
          fi

  migrations:
    name: Migrations (fresh DB)
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: belune
          POSTGRES_PASSWORD: belune
          POSTGRES_DB: belune
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U belune"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Apply all migrations on a fresh database
        env:
          DATABASE_URL: postgres://belune:belune@localhost:5432/belune?sslmode=disable
        run: go run ./cmd/migrate-check

  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # -b (build mode) is load-bearing, not a style choice. The root tsconfig is
      # solution-style — `"files": []` plus `references` to tsconfig.app.json and
      # tsconfig.node.json — and plain `tsc` ignores `references` entirely. It
      # therefore compiles an empty file set, exits 0 in under a second, and
      # reports success without having read a single line of src/. Build mode
      # follows the references and checks the projects behind them. A type check
      # that cannot fail is not a type check.
      - name: Type check
        run: npx tsc -b --noEmit

      - name: Test
        run: npm run test

      - name: Lint
        run: npm run lint

      # Prettier is the formatter `task fmt` already runs; this stops the
      # repository drifting away from it again. Without the check, unformatted
      # files accumulate silently and the next person to run `task fmt` drags an
      # unrelated 68-file diff into their own pull request. Generated and build
      # output are excluded in apps/web/.prettierignore.
      - name: Format check
        run: npm run format:check

  restore-drill:
    name: Restore drill
    runs-on: ubuntu-latest
    needs: [backend, migrations]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: belune
          POSTGRES_PASSWORD: belune
          POSTGRES_DB: belune
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U belune"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Install PostgreSQL 16 client
        run: |
          sudo apt-get install -y --no-install-recommends postgresql-client-16 2>/dev/null \
            || sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Apply migrations (baseline)
        env:
          DATABASE_URL: postgres://belune:belune@localhost:5432/belune?sslmode=disable
        run: go run ./cmd/migrate-check

      - name: Seed representative rows
        # PGPASSWORD is the fixed CI-only service container password — intentional plaintext.
        env:
          PGPASSWORD: belune
        run: |
          psql -h localhost -U belune -d belune \
            -c "INSERT INTO settings (key, value) VALUES ('restore_drill_marker', 'phase7') ON CONFLICT (key) DO NOTHING;"
          psql -h localhost -U belune -d belune \
            -c "INSERT INTO users (email, password_hash, role, username, first_name, last_name) VALUES ('drill@example.com', '\$2a\$10\$aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa', 'admin', 'drill', 'Drill', 'User');"

      - name: Dump database
        env:
          PGPASSWORD: belune
        run: pg_dump -h localhost -U belune belune > /tmp/belune-drill.sql

      - name: Drop and recreate database
        env:
          PGPASSWORD: belune
        run: |
          psql -h localhost -U belune -d postgres -c "DROP DATABASE belune;"
          psql -h localhost -U belune -d postgres -c "CREATE DATABASE belune;"

      - name: Restore from dump
        env:
          PGPASSWORD: belune
        run: psql -h localhost -U belune -d belune < /tmp/belune-drill.sql

      - name: Re-apply migrations (must be idempotent no-op)
        env:
          DATABASE_URL: postgres://belune:belune@localhost:5432/belune?sslmode=disable
        run: go run ./cmd/migrate-check

      - name: Verify seeded rows survived round-trip
        env:
          PGPASSWORD: belune
        run: |
          SETTING=$(psql -h localhost -U belune -d belune -t -A \
            -c "SELECT value FROM settings WHERE key = 'restore_drill_marker';")
          [ "${SETTING}" = "phase7" ] || { echo "FAIL: settings row missing after restore"; exit 1; }

          COUNT=$(psql -h localhost -U belune -d belune -t -A \
            -c "SELECT COUNT(*) FROM users WHERE email = 'drill@example.com';")
          [ "${COUNT}" = "1" ] || { echo "FAIL: user row missing after restore"; exit 1; }

          echo "Restore drill passed: all rows survived the round-trip."

  # Building the image proved only that it compiles. Every bug found during the
  # v0.0.29 VPS trial compiled perfectly and shipped a running container that
  # quietly did nothing — request logging and ACME failure reporting were both
  # entirely dead in production while every test was green. So this job boots the
  # real production stack and asserts the features are alive.
  prod-smoke:
    name: Production smoke drill
    runs-on: ubuntu-latest
    needs: [backend, frontend, migrations, restore-drill]
    # Runs on pull requests as well as pushes, deliberately.
    #
    # It used to be `if: github.event_name == 'push'`, and push only fires on
    # main — so the only job that builds the image and boots a stack ran AFTER
    # merge. No Dockerfile change, and nothing this drill asserts, was ever
    # verified on a pull request: a PR went green, merged, and turned main red.
    # For a repository whose releases are cut from main that is backwards.
    #
    # The cost is small and was measured before changing it: 1m with a warm
    # build cache, ~3m when the web or Go tree changed. It is also the tail of
    # the pipeline (it needs the four jobs above), so it adds that much to a PR
    # and nothing to the critical path of the others.
    #
    # ⚠️ It must stay OUT of the branch ruleset's required-checks list. The
    # earlier harm was the inverse of this one: it was required while never
    # running, so every PR showed an unsatisfied check that could not be
    # satisfied (removed from the list 2026-09-22). Visible before merge,
    # advisory, is the combination that works.
    #
    # The one exception is the manifest PR that release.yml opens for itself.
    # Its branch name is built in that workflow as "bump-versions-json-${TAG}",
    # it is authored by app/github-actions, and by construction it contains a
    # single file: apps/site/public/versions.json, which is not in the image's
    # build context at all. Building the image and booting a stack for it is
    # provably pointless, and it is the only site-only PR that recurs.
    #
    # ⛔ Deliberately NOT a general "skip when only apps/site changed" filter.
    # That needs a diff against the base and a job to compute it, and if the
    # logic is ever wrong it silently stops running the one check that covers
    # the image — which is exactly the blind spot this job was switched to
    # pull_request to close. A branch-name match can only ever skip the shape
    # release.yml creates, and the cost of being wrong is one wasted build.
    if: ${{ !startsWith(github.head_ref, 'bump-versions-json-') }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: belune:ci
          # Load into the local daemon so the drill can actually run it.
          load: true
          # ⚠️ Stamped, and it has to be. VERSION defaults to "dev" in the
          # Dockerfile, and "dev" means "unstamped" to the dashboard — the
          # Updates card hides itself rather than compare against it, so an
          # unstamped image makes every update-shaped assertion silently pass by
          # having nothing to click. Deliberately low, so a seeded "latest" is
          # always newer. Mirrors SMOKE_VERSION in scripts/smoke-prod.sh, which
          # is what stamps a build this script does itself; assertion 13 there
          # fails attributably if either is lost.
          build-args: |
            VERSION=v0.1.0
          cache-from: type=gha
          # Written only on push. A pull_request build's cache is scoped to that
          # PR's own ref, so nothing else can ever read it — it would consume the
          # repository's cache quota to warm a cache for one branch, and from a
          # fork the cache service rejects the write outright.
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}

      # For the browser half below. The frontend job installs these too, but
      # jobs do not share a filesystem.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Chromium
        working-directory: apps/web
        # --with-deps pulls the system libraries headless Chromium needs on a
        # bare runner; without them it installs fine and then fails to launch.
        run: npx playwright install --with-deps chromium

      - name: Boot the production stack and drill it, by API and by browser
        # One step, because the browser drill boots the stack through
        # smoke-prod.sh (KEEP=1) and depends on everything it asserts. A failure
        # in the API half therefore stops here rather than being reported as a
        # missing button in a browser test.
        run: BELUNE_IMAGE=belune:ci ./scripts/smoke-browser.sh

      - name: Keep the browser drill's evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-drill-trace
          # A screenshot and a Playwright trace of the failing page, kept only
          # for failures — a trace of a passing run is megabytes of nothing.
          # The stack is torn down on the way out, so this is the only thing
          # left to look at.
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

