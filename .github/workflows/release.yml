name: Release

# Publishes a release when a version tag is pushed:
#   git tag -a v0.1.0 -m "v0.1.0" && git push origin v0.1.0
#
# Produces a multi-architecture image on GHCR and a GitHub Release whose notes
# are built from the conventional-commit log. install.sh pins the version it
# installs, so :latest exists for humans rather than for the installer — and it
# only moves for stable tags, never for a prerelease like v0.1.0-rc1.

on:
  push:
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  # A LITERAL, deliberately not ${{ github.repository }}. GHCR packages belong to
  # the ACCOUNT, not the repository, so a rename or an org transfer would move
  # this repo without moving the package — and the next release would publish to
  # a path no installed updater pulls from, with the run still green. Every
  # install resolves its next version using the image path ITS OWN version was
  # built with, so this string has to outlive the repo's name.
  #
  # That transfer has now happened: this repo lives under belune-hq while the
  # package still belongs to weiliang79, and a GHCR package cannot be moved or
  # redirected. So every release publishes BOTH paths from one build. The legacy
  # path is not a mirror of the real one — it IS the path every existing install
  # pulls from, and it keeps receiving every release for as long as any install
  # still names it.
  IMAGE_NAME: weiliang79/belune # what installed updaters pull
  ORG_IMAGE_NAME: belune-hq/belune # where new installs get pointed later

jobs:
  # A tag must not publish a broken image. CI runs on branch pushes, not tags,
  # so the core checks run again here.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Backend vet and tests
        working-directory: apps/api
        # -short matches ci.yml: the integration suites need a Docker daemon and
        # live services, and are gated behind their own env vars. Running the
        # full suite here would block releases on tests CI never ran.
        run: |
          go vet ./...
          go test -short -count=1 ./...

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Frontend tests and build
        working-directory: apps/web
        run: |
          npm ci
          npm run test
          npm run build

  publish:
    name: Build and publish image
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write # create the GitHub Release, push the versions.json bump branch
      # Not what pushes the image — see the login step below, which uses a PAT
      # because the legacy package is cross-account. Kept so the org path can go
      # back to GITHUB_TOKEN on the day the legacy path is finally retired.
      packages: write
      pull-requests: write # open the versions.json PR

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so release notes can diff against the previous tag

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN cannot do this job any more. It is scoped to this
      # repository's owner (belune-hq) and the legacy package belongs to
      # weiliang79 — a cross-account write GHCR refuses. A package's "Actions
      # repository access" list is the documented way to grant some other
      # repository write access to it, but it only offers repositories owned by
      # the package's owner, so an org repo cannot be added at all (measured,
      # 2026-10-20). Hence a classic PAT owned by weiliang79 with
      # write:packages. One login has to cover both paths: they share a registry
      # host and docker holds a single credential per host.
      - name: Check the legacy credential is present
        env:
          TOKEN: ${{ secrets.GHCR_LEGACY_TOKEN }}
        run: |
          if [ -z "${TOKEN}" ]; then
            echo "::error::GHCR_LEGACY_TOKEN is not set, so this release cannot publish" \
                 "ghcr.io/${IMAGE_NAME} — the path every installed updater pulls from." \
                 "Failing before anything is published rather than shipping a release" \
                 "no install can reach."
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          # The package owner, not github.actor: the credential below is that
          # account's PAT, and whoever pushed the tag is irrelevant to it.
          username: weiliang79
          password: ${{ secrets.GHCR_LEGACY_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Both paths take the identical tag set and one push writes both, so a
          # given tag always carries the SAME digest at both — which makes
          # verifying a release a digest comparison rather than two separate
          # byte checks.
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.REGISTRY }}/${{ env.ORG_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The Go and frontend stages cross-compile from the build platform, so
          # only the small runtime stage touches emulation.
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build release notes
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The previous STABLE release, not merely the nearest tag. An rc is a
          # tag too, so a plain `git describe` on a release line that had rcs
          # resolves to the last rc and truncates the range to the few commits
          # since it: v0.1.16's notes were built from 2 commits out of 10, and 6
          # of the 17 releases to date were truncated this way. --match keeps
          # non-release tags out (there is a `belune-hoist-archive`) and
          # --exclude drops both `-rc` and the archived `-alpha` line.
          #
          # The same derivation is repeated in the versions.json step below,
          # where it decides the manifest flags. Fix both or neither — which is
          # why the empty-PREV guard below is duplicated too, even though this
          # step runs first and would already have stopped the release.
          #
          # ⚠️ That guard replaces a FALLBACK, and the fallback was the worse
          # option. `RANGE="${TAG}"` looks like a safe degradation and is not:
          # `git log "$TAG"` walks the whole of history, while
          # `git diff --quiet "$TAG"` compares the tag against a working tree
          # that IS that tag, so the two flags come out wrong in opposite
          # directions and nothing says so. Refusing to guess is the only
          # honest behaviour, and this is the one branch CI can never exercise
          # — release.yml runs on a tag push and nowhere else.
          PREV=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' "${TAG}^" 2>/dev/null || true)
          if [ -z "${PREV}" ]; then
            echo "::error::No stable tag is an ancestor of ${TAG}, so the release range cannot be derived. Everything below would be computed against the whole of history: the notes would list every commit ever made, the breaking flag would almost certainly find a Conventional Commits bang somewhere and ship true, and requires_host_update would compare the tag against an identical working tree and ship false. Wrong in both directions, silently. The one legitimate case is the first stable release of a fresh history, which is a by-hand job."
            exit 1
          fi
          RANGE="${PREV}..${TAG}"

          {
            echo "## What's changed"
            echo

            # Conventional Commits marks a breaking change with `!` before the
            # colon. Surface those FIRST and on their own, because the type they
            # carry actively misleads otherwise: a path move is a `refactor!`,
            # which files under "Internal" — a heading that tells the reader to
            # skip the entry that renames their endpoints.
            breaking=$(git log --no-merges --pretty=format:'- %s' "$RANGE" \
                         | grep -E "^- [a-z]+(\(.+\))?!: " || true)
            if [ -n "$breaking" ]; then
              echo "### ⚠️ Breaking changes"
              echo
              echo "$breaking" | sed -E "s/^- [a-z]+(\((.+)\))?!: /- \2: /; s/^- : /- /"
              echo
              echo "Read [the changelog](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/CHANGELOG.md)"
              echo "before upgrading — it says what breaks and what to change."
              echo
            fi

            emit() { # $1 = conventional prefix, $2 = heading
              body=$(git log --no-merges --pretty=format:'- %s' "$RANGE" \
                       | grep -E "^- $1(\(.+\))?!?: " || true)
              if [ -n "$body" ]; then
                echo "### $2"
                echo
                # Strip the type prefix; keep any scope for context. Breaking
                # entries stay in their own type section too, so each list is
                # complete — but they keep a marker, since `!` is consumed here.
                echo "$body" \
                  | sed -E "s/^- $1(\((.+)\))?!: /- **Breaking** \2: /" \
                  | sed -E "s/^- $1(\((.+)\))?: /- \2: /" \
                  | sed -E "s/^- (\*\*Breaking\*\* )?: /- \1/"
                echo
              fi
            }
            emit feat "Features"
            emit fix "Fixes"
            emit perf "Performance"
            emit refactor "Internal"
            emit docs "Documentation"

            echo "### Install"
            echo
            echo '```bash'
            # Pinned to this release: without it the installer resolves the
            # newest non-prerelease, so a release candidate's own notes would
            # install something else — or nothing, when no stable release exists.
            echo "curl -sSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${TAG}/scripts/install.sh \\"
            echo "  | BELUNE_VERSION=${TAG} bash"
            echo '```'
            echo
            echo "Upgrading an existing install: run \`update.sh\` from your install"
            echo "directory. **Take a backup first** — 0.x minor releases may contain"
            echo "breaking changes."
            echo
            if [ -n "$PREV" ]; then
              echo "**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}"
            fi
          } > release-notes.md

          echo "Generated notes for ${RANGE}:"
          cat release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          PRERELEASE=""
          case "$TAG" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md \
            $PRERELEASE \
            scripts/install.sh \
            scripts/update.sh

      # apps/site/public/versions.json used to be edited by hand at changelog-cut
      # time — harmless while nothing read it, but the update-check worker
      # (v0.1.8) reads it daily, and a forgotten bump silently tells every
      # install it is current forever: no error, just no notification, ever.
      # Runs from the TAG push (this job), not a merge to main, because the
      # manifest names a release whose notes_url must already resolve — hence
      # this step comes after "Create GitHub Release", not before it.
      #
      # main requires a PR (protect-main-quality): a plain `git push` here would
      # just be rejected, and the default GITHUB_TOKEN doesn't get the ruleset's
      # role-based bypass (that's for the repo owner's own account). So this
      # opens a PR instead of pushing directly — same door a human edit would use
      # — and stops there; auto-merge is off for this repo, so it waits for a
      # human to merge once the required checks pass. continue-on-error: a
      # failure here (a transient API hiccup, a merge conflict from two tags
      # landing close together) must not mark an otherwise-successful release
      # red — the pre-existing fallback (edit versions.json by hand) still
      # works exactly as it always has.
      - name: Open a PR bumping versions.json
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # versions.json only ever names STABLE releases — a prerelease is not
          # something a self-hoster should be nagged to update to, the same
          # reasoning the :latest docker tag above is gated on.
          case "$TAG" in
            *-*)
              echo "Prerelease tag — skipping the versions.json bump."
              exit 0
              ;;
          esac

          VERSION="${TAG#v}"
          # Previous STABLE release — see the release-notes step above for why a
          # plain `git describe` is wrong here. It matters more at this site than
          # it does there: a truncated range makes BOTH flags below lie. A
          # breaking change merged before the final rc would ship
          # `breaking: false`, and an infra change before it would ship
          # `requires_host_update: false`, which tells a self-hoster a plain
          # `docker compose up -d` is enough while the systemd unit has moved.
          PREV=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' "${TAG}^" 2>/dev/null || true)
          if [ -z "${PREV}" ]; then
            echo "::error::No stable tag is an ancestor of ${TAG}, so the release range cannot be derived. Everything below would be computed against the whole of history: the notes would list every commit ever made, the breaking flag would almost certainly find a Conventional Commits bang somewhere and ship true, and requires_host_update would compare the tag against an identical working tree and ship false. Wrong in both directions, silently. The one legitimate case is the first stable release of a fresh history, which is a by-hand job."
            exit 1
          fi
          RANGE="${PREV}..${TAG}"

          # Same signal "Build release notes" above already keys its own
          # "Breaking changes" section off: a Conventional Commits `!` before
          # the colon. Checked against every released versions.json entry from
          # v0.1.0 to v0.1.16 and it agrees with the flag that shipped — but
          # note the signal is only as good as the subject line it reads. A
          # breaking change whose squash/merge subject carries no `!` derives
          # as false no matter how correct the range is, which is how v0.1.12
          # came to need its flag set by hand in the manifest PR. Derived, not
          # guaranteed: the PR body below asks for both flags to be checked.
          BREAKING=false
          if git log --no-merges --pretty=format:'%s' "${RANGE}" \
               | grep -qE '^[a-z]+(\(.+\))?!: '; then
            BREAKING=true
          fi

          # requires_host_update means an in-place `docker compose up -d` is not
          # enough — the compose file or a systemd unit itself moved. Verified
          # the same way: matches every past release's hand-set flag exactly.
          REQUIRES_HOST_UPDATE=false
          if ! git diff --quiet "${RANGE}" -- infra/docker-compose.prod.yml infra/systemd/ 2>/dev/null; then
            REQUIRES_HOST_UPDATE=true
          fi

          NOTES_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

          git fetch origin main
          BRANCH="bump-versions-json-${TAG}"
          git checkout -b "${BRANCH}" origin/main

          jq --arg version "${VERSION}" \
             --argjson breaking "${BREAKING}" \
             --argjson requires_host_update "${REQUIRES_HOST_UPDATE}" \
             --arg notes_url "${NOTES_URL}" \
             '.latest = $version
              | .releases = [{
                  version: $version,
                  breaking: $breaking,
                  requires_host_update: $requires_host_update,
                  notes_url: $notes_url
                }] + .releases' \
             apps/site/public/versions.json > /tmp/versions.json.next
          mv /tmp/versions.json.next apps/site/public/versions.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/site/public/versions.json
          git commit -s -m "chore(site): add ${TAG} to versions.json"
          git push origin "${BRANCH}"

          {
            echo "Automated — registers ${TAG} in the update-check manifest."
            echo
            echo "- \`breaking\`: ${BREAKING}"
            echo "- \`requires_host_update\`: ${REQUIRES_HOST_UPDATE}"
            echo
            echo "Both derived from the same signals the release notes above already"
            echo "use (a Conventional Commits \`!\` marker, and whether"
            echo "\`infra/docker-compose.prod.yml\`/\`infra/systemd/\` changed in this"
            echo "release) — double-check them against the actual release before"
            echo "merging, the way you would any other hand-set flag."
            echo
            echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          } > pr-body.md

          gh pr create \
            --base main \
            --head "${BRANCH}" \
            --title "chore(site): add ${TAG} to versions.json" \
            --body-file pr-body.md
