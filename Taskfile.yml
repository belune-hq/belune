version: '3'

dotenv: ['.env']

vars:
  API_DIR: apps/api
  WEB_DIR: apps/web
  SITE_DIR: apps/site
  INFRA_DIR: infra

tasks:
  # ─── Development ───────────────────────────────────────────────

  dev:api:
    desc: Run Go API with hot reload
    dir: '{{.API_DIR}}'
    cmd: air
    env:
      ENV_FILE: '{{.ROOT_DIR}}/.env'

  dev:web:
    desc: Run React dev server
    dir: '{{.WEB_DIR}}'
    cmd: npm run dev

  dev:infra:
    desc: Start Postgres, Redis, Caddy via Docker Compose
    dir: '{{.INFRA_DIR}}'
    cmd: docker compose up -d

  dev:infra:down:
    desc: Stop infrastructure containers
    dir: '{{.INFRA_DIR}}'
    cmd: docker compose down

  # ─── Observability (opt-in) ──────────────────────────────────
  # Requires the `belune-infra` network, which `dev:infra` creates.
  # Prometheus scrapes the API at host.docker.internal:9090 (METRICS_BIND=127.0.0.1:9090).

  observability:up:
    desc: Start Prometheus + Grafana + Jaeger alongside the main infra stack
    dir: '{{.INFRA_DIR}}'
    cmd: docker compose -f compose.observability.yml up -d

  observability:down:
    desc: Stop the observability stack
    dir: '{{.INFRA_DIR}}'
    cmd: docker compose -f compose.observability.yml down

  # ─── Build ─────────────────────────────────────────────────────

  build:web:
    desc: Build React static output and copy assets into the Go embed directory
    dir: '{{.WEB_DIR}}'
    cmds:
      - npm run build
      - rm -rf ../api/web/dist/*
      - cp -r build/. ../api/web/dist/

  build:api:
    desc: Build Go binary with embedded frontend
    dir: '{{.API_DIR}}'
    cmd: go build -o ../../belune ./cmd/server

  build:
    desc: Build everything (frontend then backend)
    cmds:
      - task: build:web
      - task: build:api

  # ─── Code Generation ──────────────────────────────────────────

  generate:sqlc:
    desc: Regenerate sqlc Go code from SQL queries
    dir: '{{.API_DIR}}'
    cmd: sqlc generate

  generate:types:
    desc: Regenerate types from OpenAPI spec
    cmds:
      - 'echo "TODO: Add OpenAPI type generation commands"'

  generate:api-docs:
    desc: Regenerate apps/site/public/openapi.json and its site pages by probing the real router (Docker must be running)
    cmds:
      - task: generate:api-docs:spec
      - task: generate:api-docs:pages

  generate:api-docs:spec:
    internal: true
    dir: '{{.API_DIR}}'
    # -run must keep including TestAPIDocAllMarshalerTypesHandled — it's
    # gated behind the same GENERATE_API_REFERENCE env var as the generator
    # itself (it re-walks the generator's own output), so narrowing -run to
    # just TestGenerateAPIReference silently stops it from ever running,
    # anywhere, defeating the guard it exists to be. Found by peer review.
    cmd: go test -count=1 -timeout=120s -run 'TestGenerateAPIReference|TestAPIDocAllMarshalerTypesHandled' ./internal/handler/...
    env:
      GENERATE_API_REFERENCE: '1'

  generate:api-docs:pages:
    internal: true
    dir: '{{.SITE_DIR}}'
    cmd: node scripts/generate-api-pages.mjs

  # ─── Database ──────────────────────────────────────────────────

  db:migrate:up:
    desc: Run all pending migrations
    dir: '{{.API_DIR}}'
    cmd: migrate -path internal/migrations -database "${DATABASE_URL}" up

  db:verify:
    desc: Check the live database against what the migrations actually produce
    cmd: ./scripts/verify-schema.sh {{.CLI_ARGS}}

  db:migrate:down:
    desc: Rollback last migration
    dir: '{{.API_DIR}}'
    cmd: migrate -path internal/migrations -database "${DATABASE_URL}" down 1

  db:migrate:fresh:
    desc: Drop all tables and re-run all migrations
    dir: '{{.API_DIR}}'
    cmds:
      - migrate -path internal/migrations -database "${DATABASE_URL}" drop -f
      - migrate -path internal/migrations -database "${DATABASE_URL}" up

  db:migrate:create:
    desc: Create a new migration file
    dir: '{{.API_DIR}}'
    cmd: migrate create -ext sql -dir internal/migrations -seq {{.CLI_ARGS}}

  # ─── Encryption ────────────────────────────────────────────────

  encryption:rewrap:
    desc: |
      Re-encrypt every secret column under the current KEK. Idempotent — rows
      already tagged with the current version are skipped. Pass --dry-run to
      report without writing: `task encryption:rewrap -- --dry-run`.
    dir: '{{.API_DIR}}'
    cmd: go run ./cmd/rewrap {{.CLI_ARGS}}

  # ─── Testing ───────────────────────────────────────────────────

  test:api:
    desc: Run Go tests
    dir: '{{.API_DIR}}'
    cmd: go test ./...

  test:web:
    desc: Run React tests
    dir: '{{.WEB_DIR}}'
    cmd: npm run test

  test:browser:
    desc: Boot the production stack and drive the dashboard in a real browser
    # Deliberately NOT part of `task test`: it builds the image and boots five
    # containers. Needs Docker. Extra flags reach Playwright, e.g.
    # `task test:browser -- --headed`.
    cmd: ./scripts/smoke-browser.sh {{.CLI_ARGS}}

  test:
    desc: Run all tests
    cmds:
      - task: test:api
      - task: test:web

  # ─── Linting & Formatting ─────────────────────────────────────

  lint:
    desc: Run all linters
    cmds:
      - cd {{.API_DIR}} && golangci-lint run
      - cd {{.WEB_DIR}} && npm run lint

  fmt:
    desc: Format all code
    cmds:
      - cd {{.API_DIR}} && gofmt -w .
      - cd {{.WEB_DIR}} && npx prettier --write .
