# Every relative path below is resolved against the PROJECT DIRECTORY, which is
# the repo root here and the install directory (/opt/belune) on a real install —
# install.sh lands this file at the install root and mirrors infra/ beneath it.
# From the repo, that means passing --project-directory explicitly:
#
#   docker compose --project-directory . --env-file .env -f infra/docker-compose.prod.yml up -d
#
# Without it Compose takes the project directory from this file's own location
# (infra/), and `.env`, `./infra/caddy`, and `./infra/buildkit` all resolve one
# level too deep.
#
# `env_file:` below passes variables *into the container*, but ${VAR} substitution
# in this file is resolved by Compose from the project directory, not from
# env_file. Without --env-file, BELUNE_IMAGE and DOCKER_GID silently fall back to
# their defaults — and because a `build:` section exists, an unresolved image
# makes Compose build from source instead of erroring. On a small box that looks
# like a hang, not a misconfiguration.

services:
  belune:
    image: ${BELUNE_IMAGE:-ghcr.io/weiliang79/belune:latest}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Bound to loopback: Caddy serves the dashboard on :80/:443 and reaches the
      # API over the compose network. Publishing 8080 publicly would expose the
      # login page — and every API route — in plaintext, bypassing TLS entirely.
      - "127.0.0.1:8080:8080"
    env_file:
      - ./.env
    environment:
      # railpack (and pack) build via this BuildKit daemon on the internal network.
      BUILDKIT_HOST: tcp://buildkit:1234
      # Where Caddy's access log lands inside THIS container. The default is a
      # repo-relative dev path (../../infra/caddy/logs/access.log) that does not
      # exist here, so without this the tailer silently found nothing and the
      # request-log feature was dead in production — zero rows, no error.
      ACCESS_LOG_PATH: /var/log/caddy/access.log
    volumes:
      # Belune's whole job is managing containers, so it needs the Docker API.
      # Without this it starts, serves the UI, and can do nothing: no deploys, no
      # log collection, and /healthz reports 503 because the Docker check fails.
      - /var/run/docker.sock:/var/run/docker.sock
      # Caddy writes its access log here; Belune tails it. Read-only: only Caddy
      # should ever write to it.
      - caddylogs:/var/log/caddy:ro
      # Persist managed-database logical dumps (DATABASE_BACKUP_DIR=/data/backups/databases)
      # so local restore works across container recreation.
      - belunedata:/data
      # Per-app file/config mounts are materialised as host files here, then
      # bind-mounted read-only into app containers. Because Docker resolves those
      # binds on the HOST, this must be shared into the API at the SAME path
      # (FileMountsDir defaults to /opt/belune/filemounts) — otherwise the API
      # writes into its own ephemeral fs and the app-container bind finds nothing.
      # install.sh/update.sh create this dir owned by the belune container's uid.
      - ./filemounts:/opt/belune/filemounts
      # Control-plane backups (Postgres dump + Caddy TLS data + .env), written
      # natively by the worker (ControlPlaneBackupDir defaults to
      # /opt/belune/backups). Must be the SAME host path scripts/backup.sh and
      # restore.sh use — restore.sh is host-CLI-only by design (must work when
      # the dashboard/DB are down), so the archive has to land on the host, not
      # in a named volume the host can't read directly.
      - ./backups:/opt/belune/backups
      # Read-only copy of .env so a control-plane backup can include it verbatim
      # (env_file: above injects variables into the process but not the file
      # itself). install.sh/update.sh create ./backups owned by the belune
      # container's uid, same pattern as filemounts.
      - ./.env:/opt/belune/.env:ro
      # Dashboard-managed remote-storage config (BACKUP_S3_*/BACKUP_REMOTE_ENABLED),
      # separate from .env so the dashboard never writes bootstrap secrets like
      # ENCRYPTION_KEY. Read-write: the Remote Storage card saves here.
      # install.sh/update.sh `touch` (not mkdir — this is a file, not a dir) and
      # chown it to the belune container's uid; the file must already exist
      # before the container starts, since the container can write the file's
      # contents but can't create a new directory entry in the root-owned
      # install dir. scripts/backup.sh and belune-backup-upload read the same
      # file for the host/CLI backup path.
      - ./backup-remote.env:/opt/belune/backup-remote.env
    # The image runs as the non-root `belune` user, so mounting the socket is not
    # enough — it must also be in the group that owns it on the host. The GID
    # differs per distro (Debian/Ubuntu usually 999), hence the override:
    #   echo "DOCKER_GID=$(getent group docker | cut -d: -f3)" >> .env
    group_add:
      - "${DOCKER_GID:-999}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      buildkit:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # A hard cpus cap that exceeds the host's core count is a fatal "cannot
          # create container" error, not a soft throttle — so a 1-vCPU VPS could
          # not start the stack at all. install.sh clamps these to nproc; the
          # defaults here are the ceiling on a box with cores to spare.
          cpus: "${BELUNE_CPU_LIMIT:-2.0}"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-belune}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-belune}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-belune}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${POSTGRES_CPU_LIMIT:-1.0}"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${REDIS_CPU_LIMIT:-0.5}"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # BuildKit daemon that railpack/pack use to build app images. Pinned to match
  # dev (infra/docker-compose.yml). Not exposed to the host — only the belune
  # service reaches it over the internal network. Requires privileged mode.
  buildkit:
    image: moby/buildkit:v0.31.1
    privileged: true
    command: --addr tcp://0.0.0.0:1234 --config /etc/buildkit/buildkitd.toml
    volumes:
      - buildkitcache:/var/lib/buildkit
      - ./infra/buildkit/buildkitd.toml:/etc/buildkit/buildkitd.toml:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  caddy:
    # belune-caddy is upstream Caddy plus seven optional modules (rate limiting,
    # three DNS providers, WAF, CrowdSec, layer4). Belune probes the running Caddy
    # for them and reports a feature whose module is absent as "not configured",
    # so stock caddy:2-alpine stays a fully supported configuration, not a
    # degraded one. BELUNE_CADDY_IMAGE is the bring-your-own escape hatch: point
    # it back at upstream and every core function keeps working.
    image: ${BELUNE_CADDY_IMAGE:-ghcr.io/belune-hq/belune-caddy:2}
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:2019:2019"
    volumes:
      - ./infra/caddy/Caddyfile.template:/etc/caddy/Caddyfile
      - ./infra/caddy/sites:/etc/caddy/sites
      - caddydata:/data
      - caddyconfig:/config
      - caddylogs:/var/log/caddy
    environment:
      # Extra Caddy global options, injected per-deployment. Leave unset for
      # normal operation (public Let's Encrypt). Point it at the ACME staging
      # directory to rehearse issuance without burning production rate limits:
      #   BELUNE_CADDY_GLOBAL_OPTIONS=acme_ca https://acme-staging-v02.api.letsencrypt.org/directory
      BELUNE_CADDY_GLOBAL_OPTIONS: ${BELUNE_CADDY_GLOBAL_OPTIONS:-}
    labels:
      # Streams Caddy's own logs into container_logs, which is how ACME failure
      # reasons reach the TLS status badge instead of dying in stdout.
      - belune-system=caddy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${CADDY_CPU_LIMIT:-1.0}"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
  caddylogs:
  belunedata:
  buildkitcache:
